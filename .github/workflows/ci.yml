name: ci

on:
  push:
  pull_request:

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start Oracle Database 23ai Free
        uses: gvenzl/setup-oracle-free@v1
        with:
          tag: 23
          oracle-password: wardround
          app-user: wardround
          app-user-password: wardround

      - name: Install and test
        run: ./scripts/ci.sh
