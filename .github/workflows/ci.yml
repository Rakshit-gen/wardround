name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Benchmark the Python side
        run: python bench/python.py 5

  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Start Oracle Database Free
        uses: gvenzl/setup-oracle-free@v1
        with:
          tag: 23
          oracle-password: wardround
          app-user: wardround
          app-user-password: wardround

      - name: Install and test the PL/SQL
        run: ./scripts/ci.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"

      - name: Generate, send, apply and report
        run: ./scripts/pipeline.sh

      - name: Database tests from Python
        env:
          WARDROUND_DSN: localhost/FREEPDB1
        run: pytest -q -m db

      - name: Keep the coverage report and the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/coverage.xml
            build/reports.txt
            build/reports.html
            build/listener.log
          if-no-files-found: ignore
